function crispDetails(){
  ctx.save();
  const night=level===5||level===10;
  // Layered distant ridge silhouettes; vector geometry stays crisp at all screen sizes.
  for(let layer=0;layer<3;layer++){
    const base=390+layer*55;
    ctx.beginPath();ctx.moveTo(0,720);ctx.lineTo(0,base);
    for(let x=0;x<=1300;x+=10){
      let y=base+Math.sin(x/115+layer*1.8)*24+Math.sin(x/43+layer)*9;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(1280,720);ctx.closePath();
    ctx.fillStyle=(night?['#41407833','#49407944','#352d6955']:['#ffffff16','#376d5430','#245f4840'])[layer];ctx.fill();
  }
  // Sparkling highlights and foliage details.
  for(let i=0;i<95;i++){
    const x=(i*149+31)%1280,y=595+(i*41)%105;
    const hue=level===8?330:level===9?195:level===6?39:125;
    ctx.fillStyle=`hsla(${hue},80%,${i%3===0?85:55}%,.6)`;
    ctx.beginPath();ctx.ellipse(x,y,2+i%3,5+i%4,(i%5)*.5,0,Math.PI*2);ctx.fill();
  }
  // Clouds are vector shapes and contain no labels or lettering.
  if(!night)for(let i=0;i<5;i++){
    const x=(i*291+70+clock*(i%2?.11:.07))%1480-100,y=95+i%3*56;
    ctx.fillStyle='#ffffff55';
    for(const [dx,dy,r] of [[0,0,25],[24,-12,35],[57,0,27],[33,8,29]]){
      ctx.beginPath();ctx.arc(x+dx,y+dy,r,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.restore();
}

function render(ts){const dt=Math.min(2,(ts-(render.last||ts))/16.67);render.last=ts;clock+=dt;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,C.width,C.height);ctx.translate(ox,oy);ctx.scale(scaleX,scaleY);ctx.save();if(camShake>0){ctx.translate(rand(-camShake,camShake),rand(-camShake,camShake));camShake*=.82;if(camShake<.3)camShake=0}scenery();premiumWorld();crispDetails();cinematicLight();ctx.fillStyle='#3c7536';ctx.beginPath();ctx.ellipse(240,585,88,13,0,0,Math.PI*2);ctx.fill();for(const b of blocks)if(b.hp>0)drawBlock(b);for(const t of targets)drawTarget(t);drawFrogs(dt);drawSling();if(active&&active.launched)for(let i=0;i<active.trail.length;i++){const p=active.trail[i];circle(p.x,p.y,2+i*.13,'#fff9d6aa')}drawBird(active);for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.2*dt;p.life-=dt;ctx.globalAlpha=clamp(p.life/p.max,0,1);circle(p.x,p.y,p.r,p.color);ctx.globalAlpha=1;if(p.life<=0)particles.splice(i,1)}ctx.restore();physics(dt);requestAnimationFrame(render)}requestAnimationFrame(render);startMenu();})();
